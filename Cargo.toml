[package]
name        = "regit-blackscholes"
version     = "1.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "Apache-2.0"
description = "Zero-dependency Black-Scholes options pricing engine. Pure Rust."
repository  = "https://github.com/org-regit-io/regit-blackscholes"
keywords    = ["black-scholes", "blackscholes", "options", "finance", "derivatives"]
categories  = ["finance", "mathematics", "science"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
default = []
simd    = ["dep:wide"]

[dependencies]
wide = { version = "1.5", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest  = "1.11"
approx    = "0.5"

[[bench]]
name    = "blackscholes"
harness = false
